<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    body {
      background: linear-gradient(to bottom, #091E3A, #2D9EE0, #2E8FE7, #FFFFFF);
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
    }

    .settings-container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #374151;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background-color: #059669;
      color: white;
    }

    .btn-primary:hover {
      background-color: #047857;
    }

    .btn-secondary {
      background-color: #2563eb;
      color: white;
    }

    .btn-secondary:hover {
      background-color: #1d4ed8;
    }

    .message {
      padding: 0.75rem;
      border-radius: 0.5rem;
      margin-top: 1rem;
      font-weight: 500;
      text-align: center;
    }

    .message.success {
      background-color: #d1fae5;
      color: #065f46;
    }

    .message.error {
      background-color: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="settings-container w-full max-w-2xl p-8">
    <h1 class="text-2xl font-bold mb-6 text-blue-800"><i class="fas fa-cog mr-2"></i>Settings</h1>

    <!-- Settings Form -->
    <form id="settingsForm">
      <!-- Current Password -->
      <div class="form-group">
        <label for="currentPassword" class="flex items-center">
          <i class="fas fa-lock mr-2"></i> Current Password
        </label>
        <div class="relative">
          <input
            type="password"
            id="currentPassword"
            placeholder="Enter current password"
            class="focus:outline-none focus:ring-2 focus:ring-blue-500 pr-12"
          />
          <button type="button" onclick="togglePasswordVisibility('currentPassword', this)"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="text-sm text-gray-500 mt-1">
          Required only if you want to change your password below
        </div>
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label for="password" class="flex items-center">
          <i class="fas fa-lock mr-2"></i> New Password
        </label>
        <div class="relative">
          <input
            type="password"
            id="password"
            placeholder="Enter new password"
            class="focus:outline-none focus:ring-2 focus:ring-blue-500 pr-12"
          />
          <button type="button" onclick="togglePasswordVisibility('password', this)"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="text-sm text-gray-500 mt-1">
          Password must be at least 8 characters with uppercase, lowercase, and numbers
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword" class="flex items-center">
          <i class="fas fa-lock mr-2"></i> Confirm New Password
        </label>
        <div class="relative">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            class="focus:outline-none focus:ring-2 focus:ring-blue-500 pr-12"
          />
          <button type="button" onclick="togglePasswordVisibility('confirmPassword', this)"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Notification Preferences -->
      <div class="form-group">
        <label class="flex items-center">
          <input type="checkbox" id="notification" checked class="mr-2 w-4 h-4" />
          <i class="fas fa-bell mr-2"></i> Email notifications
        </label>
        <div class="text-sm text-gray-500 mt-1">
          Sent to your admin email address
        </div>
      </div>

      <!-- Message Output -->
      <div id="message" class="message hidden" aria-live="polite"></div>

      <!-- Action Buttons -->
      <div class="flex flex-col sm:flex-row gap-4 mt-6">
        <button
          type="submit"
          class="btn btn-primary flex-1"
        >
          <i class="fas fa-save mr-2"></i> Save Settings
        </button>

        <button
          type="button"
          onclick="resetForm()"
          class="btn bg-gray-600 text-white hover:bg-gray-700 flex-1"
        >
          <i class="fas fa-undo mr-2"></i> Reset
        </button>
      </div>
    </form>

    <!-- Back Button -->
    <div class="mt-8 text-center">
      <a
        href="admin_dashboard.html"
        class="btn btn-secondary"
      >
        <i class="fas fa-arrow-left mr-2"></i> Back to Dashboard
      </a>
    </div>
  </div>

  <!-- Script -->
  <script>
    const API_BASE = 'http://127.0.0.1:8001';
    const form = document.getElementById("settingsForm");
    const message = document.getElementById("message");

    // Save settings to backend
    async function saveSettingsToBackend(settings) {
      const formData = new FormData();
      formData.append('notifications', settings.notifications);

      const response = await fetch(`${API_BASE}/admin/settings`, {
        method: 'PUT',
        body: formData
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.detail || 'Failed to save settings');
      }

      return await response.json();
    }

    // Change password (while logged in, verified via current password)
    async function changePassword(currentPassword, newPassword, confirmPassword) {
      const formData = new FormData();
      formData.append('current_password', currentPassword);
      formData.append('new_password', newPassword);
      formData.append('confirm_password', confirmPassword);

      const response = await fetch(`${API_BASE}/admin/change-password`, {
        method: 'PUT',
        body: formData
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.detail || 'Failed to change password');
      }

      return await response.json();
    }

    // Load settings from localStorage on page load
    window.addEventListener("DOMContentLoaded", () => {
      const storedSettings = JSON.parse(localStorage.getItem("adminSettings")) || {};

      if (typeof storedSettings.notification === 'boolean') {
        document.getElementById("notification").checked = storedSettings.notification;
      }
    });

    // Handle form submission
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const currentPassword = document.getElementById("currentPassword").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const notification = document.getElementById("notification").checked;

      // Validate password change if a new password was provided
      if (password) {
        if (!currentPassword) {
          showMessage("Please enter your current password to change it", "error");
          return;
        }

        if (password.length < 8) {
          showMessage("Password must be at least 8 characters long", "error");
          return;
        }

        if (!/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)/.test(password)) {
          showMessage("Password must contain uppercase, lowercase letters and numbers", "error");
          return;
        }

        if (password !== confirmPassword) {
          showMessage("Passwords do not match", "error");
          return;
        }
      }

      try {
        // Save settings to backend
        await saveSettingsToBackend({
          notifications: notification
        });

        // Handle password change if provided
        if (password) {
          await changePassword(currentPassword, password, confirmPassword);
        }

        // Save to localStorage for immediate use
        localStorage.setItem("adminSettings", JSON.stringify({ notification }));

        showMessage("Settings saved successfully!", "success");

        // Clear password fields
        document.getElementById("currentPassword").value = "";
        document.getElementById("password").value = "";
        document.getElementById("confirmPassword").value = "";
      } catch (error) {
        console.error('Settings save error:', error);
        showMessage("Failed to save settings: " + error.message, "error");
      }
    });

    // Show message function
    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
      message.classList.remove("hidden");

      setTimeout(() => {
        message.classList.add("hidden");
      }, 5000);
    }

    // Toggle password field visibility
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.classList.toggle('fa-eye', !isHidden);
      icon.classList.toggle('fa-eye-slash', isHidden);
    }

    // Reset form function
    function resetForm() {
      form.reset();
      showMessage("Form has been reset", "success");
    }
  </script>
</body>
</html>
